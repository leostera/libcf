[package]
name = "libcf-benchmark-rust"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
worker = "=0.8.7"
# Already a workers-rs dependency; used for bounded fan-out (StreamExt::buffered).
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
web-sys = { version = "0.3", features = ["Crypto", "SubtleCrypto", "WorkerGlobalScope"] }

# No [profile] section: like the workers-rs hello-world template, the comparator
# uses Cargo's default release profile (opt-level 3, no LTO).
