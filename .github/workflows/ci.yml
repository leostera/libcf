name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: /usr/bin/gcc-13
      CXX: /usr/bin/g++-13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # This Node installation is for external CLI tooling.
      # Project compilation and tests use Bazel's checksum-pinned toolchains.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Install Bazel 9.3.0
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            https://github.com/bazelbuild/bazel/releases/download/9.3.0/bazel-9.3.0-linux-x86_64 \
            -o "$RUNNER_TEMP/bazel"
          echo "d302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8  $RUNNER_TEMP/bazel" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bazel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Toolchain versions
        run: |
          bazel --version
          test "$(g++-13 -dumpfullversion)" = "13.3.0"
          g++-13 --version
      # Formatting helpers (clang-format, oxfmt) are not yet clean across the
      # existing tree, and lint:cpp still needs the retired CMake configuration
      # (see CONTRIBUTING.md). CI gates on the supported Bazel workflow.
      - run: bazel test --lockfile_mode=error //...
      - run: bazel test --lockfile_mode=error --config=cxx23 //:native_tests
      - name: Relocated SDK external consumer
        run: bazel run --lockfile_mode=error //:verify_package -- "$(command -v bazel)"
      - name: Native memory and UB checks
        run: bazel test --lockfile_mode=error --config=asan --test_timeout=60 //:native_tests
      - run: npm install --global cf@1.0.0-beta.6
      - name: Offline deployment artifact dry-run
        run: |
          bazel run --lockfile_mode=error //:prepare_live_worker -- cache > "$RUNNER_TEMP/deployment.json"
          root=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).root' "$RUNNER_TEMP/deployment.json")
          cd "$root"
          cf deploy --prebuilt --dry-run
