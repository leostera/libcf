name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: 6.0.12
      - name: Toolchain versions
        run: |
          node --version
          em++ --version
          cmake --version
      - run: npm ci
      - run: npm test
      - name: Native memory and UB checks
        run: |
          cmake -S . -B build/sanitized -DCMAKE_BUILD_TYPE=Debug -DLIBCF_SANITIZERS=ON
          cmake --build build/sanitized
          ctest --test-dir build/sanitized --output-on-failure --timeout 60
      - run: npx wrangler deploy --config examples/core/wrangler.jsonc --dry-run
